<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nota</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-0:#08080a;
  --bg-1:#0f0f12;
  --bg-2:#16161a;
  --bg-3:#1c1c21;
  --bg-4:#242429;
  --bg-5:#2c2c32;

  --border-1:#1e1e24;
  --border-2:#2a2a32;
  --border-3:#38383f;

  --text-1:#f4f4f5;
  --text-2:#a1a1aa;
  --text-3:#71717a;
  --text-4:#52525b;

  --accent:#7c3aed;
  --accent-2:#8b5cf6;
  --accent-3:#a78bfa;
  --accent-bg:rgba(124,58,237,.08);
  --accent-bg2:rgba(124,58,237,.15);

  --green:#10b981;
  --red:#ef4444;
  --amber:#f59e0b;

  --r-sm:5px;
  --r-md:8px;
  --r-lg:12px;
  --r-xl:16px;

  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
  --shadow-xl:0 20px 60px rgba(0,0,0,.7);

  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Geist Mono','JetBrains Mono',monospace;

  --ease:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);

  --sidebar-w:220px;
  --list-w:300px;
}

html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--text-1);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Layout ── */
.app{display:grid;grid-template-columns:var(--sidebar-w) var(--list-w) 1fr;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{background:var(--bg-1);border-right:1px solid var(--border-1);display:flex;flex-direction:column;overflow:hidden;user-select:none}

.sidebar-top{padding:14px 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-1)}

.logo{width:28px;height:28px;background:var(--accent);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.logo svg{width:16px;height:16px;fill:white}

.brand{font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--text-1)}

.sidebar-new{margin-left:auto;width:26px;height:26px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}

.sidebar-new:hover{background:var(--accent);border-color:var(--accent)}

.sidebar-new svg{width:14px;height:14px;stroke:var(--text-2);transition:stroke .15s}

.sidebar-new:hover svg{stroke:white}

.sidebar-search{padding:10px 12px;border-bottom:1px solid var(--border-1)}

.search-box{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-md);cursor:text;transition:all .15s}

.search-box:hover{border-color:var(--border-3)}

.search-box.focused{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.search-box svg{width:13px;height:13px;stroke:var(--text-4);flex-shrink:0}

.search-box input{flex:1;background:transparent;border:none;color:var(--text-1);font-size:12.5px;font-family:var(--font);outline:none;min-width:0}

.search-box input::placeholder{color:var(--text-4)}

.search-kbd{font-family:var(--mono);font-size:10px;padding:2px 5px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:3px;color:var(--text-4);flex-shrink:0}

.sidebar-nav{flex:1;overflow-y:auto;padding:8px 8px}

.nav-section{margin-bottom:18px}

.nav-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4);padding:6px 8px 4px}

.nav-item{padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12.5px;font-weight:450;transition:all .1s;margin-bottom:1px;min-width:0}

.nav-item:hover{background:var(--bg-3);color:var(--text-1)}

.nav-item.active{background:var(--accent-bg);color:var(--accent-3)}

.nav-item svg{width:14px;height:14px;stroke:currentColor;flex-shrink:0;opacity:.8}

.nav-item .nav-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nav-item .nav-count{font-size:10.5px;color:var(--text-4);font-weight:500;flex-shrink:0}

.nav-item.active .nav-count{color:var(--accent)}

/* ── List panel ── */
.list-panel{background:var(--bg-0);border-right:1px solid var(--border-1);display:flex;flex-direction:column;overflow:hidden}

.list-header{padding:14px 16px 10px;border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:8px}

.list-title{font-size:13px;font-weight:600;color:var(--text-1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list-count{font-size:11px;color:var(--text-4);font-weight:500;flex-shrink:0}

.sort-btn{padding:4px 8px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-3);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .1s;display:flex;align-items:center;gap:4px;flex-shrink:0}

.sort-btn:hover{background:var(--bg-3);color:var(--text-1)}

.sort-btn svg{width:11px;height:11px;stroke:currentColor}

.list-body{flex:1;overflow-y:auto;padding:6px}

/* Note cards */
.note-card{padding:12px 14px;border-radius:var(--r-md);cursor:pointer;transition:background .1s,border-color .1s;margin-bottom:2px;border:1px solid transparent}

.note-card:hover{background:var(--bg-2);border-color:var(--border-1)}

.note-card.active{background:var(--accent-bg);border-color:var(--accent-bg2)}

.note-card-title{font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:3px;line-height:1.4;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note-card-preview{font-size:11.5px;color:var(--text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:7px}

.note-card-footer{display:flex;align-items:center;gap:6px}

.note-card-tags{display:flex;gap:3px;flex:1;overflow:hidden}

.pill{padding:2px 7px;background:var(--bg-3);border-radius:3px;font-size:10px;font-weight:500;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}

.note-card.active .pill{background:var(--accent-bg2);color:var(--accent-3)}

.note-card-nb{font-size:10px;color:var(--text-4);flex-shrink:0}

.note-card-date{font-size:10px;color:var(--text-4);flex-shrink:0;margin-left:auto}

/* Skeleton */
.skeleton{background:var(--bg-2);border-radius:var(--r-sm);animation:pulse 1.5s ease-in-out infinite}

@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}

.skeleton-card{padding:12px 14px;margin-bottom:2px}

/* ── Content panel ── */
.content-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-0)}

.content-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-4)}

.content-empty svg{width:40px;height:40px;stroke:var(--text-4);opacity:.3}

.content-empty-text{font-size:13px;font-weight:500;color:var(--text-4)}

.content-empty-hint{font-size:12px;color:var(--text-4);opacity:.6}

.content-header{padding:12px 32px;border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:10px;flex-shrink:0}

.breadcrumb{font-size:11.5px;color:var(--text-4);display:flex;align-items:center;gap:5px;flex:1;overflow:hidden}

.breadcrumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.breadcrumb .sep{opacity:.4;flex-shrink:0}

.breadcrumb .bc-active{color:var(--text-3)}

.content-actions{display:flex;gap:4px;flex-shrink:0}

.icon-btn{width:30px;height:30px;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);color:var(--text-3);cursor:pointer;transition:all .1s;display:flex;align-items:center;justify-content:center}

.icon-btn:hover{background:var(--bg-3);border-color:var(--border-2);color:var(--text-1)}

.icon-btn.danger:hover{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}

.icon-btn svg{width:15px;height:15px;stroke:currentColor}

.content-body{flex:1;overflow-y:auto;padding:40px 32px}

.content-inner{max-width:680px}

.content-title{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-bottom:14px;color:var(--text-1)}

.content-meta-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:12px;color:var(--text-4)}

.content-meta-row svg{width:12px;height:12px;stroke:currentColor;opacity:.7}

.content-meta-item{display:flex;align-items:center;gap:4px}

.content-meta-id{cursor:pointer;transition:all .15s;padding:2px 6px;border-radius:4px;margin-left:4px}

.content-meta-id:hover{background:var(--bg-3);color:var(--text-1)}

.content-meta-id .id-text{font-family:var(--mono);font-size:10.5px;color:var(--text-4)}

.content-tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border-1)}

.tag-pill{padding:3px 10px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:20px;font-size:11px;font-weight:500;color:var(--text-3);cursor:pointer;transition:all .1s}

.tag-pill:hover{background:var(--accent-bg);border-color:var(--accent-bg2);color:var(--accent-3)}

/* Markdown */
.md{font-size:15px;line-height:1.75;color:var(--text-2)}

.md h1,.md h2,.md h3,.md h4{color:var(--text-1);font-weight:600;letter-spacing:-.02em;margin:1.6em 0 .5em}

.md h1{font-size:1.5em;margin-top:0}
.md h2{font-size:1.25em}
.md h3{font-size:1.1em}
.md h4{font-size:1em}

.md p{margin:.75em 0}

.md a{color:var(--accent-3);text-decoration:none;font-weight:500}
.md a:hover{text-decoration:underline}

.md code{background:var(--bg-3);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:.875em;color:var(--text-1)}

.md pre{background:var(--bg-2);border:1px solid var(--border-2);padding:16px 20px;border-radius:var(--r-lg);overflow-x:auto;margin:1.2em 0}

.md pre code{background:none;padding:0;font-size:.85em}

.md blockquote{border-left:2px solid var(--accent);padding-left:16px;margin:1em 0;color:var(--text-3);font-style:italic}

.md ul,.md ol{padding-left:1.5em;margin:.75em 0}
.md li{margin:.35em 0}

.md hr{border:none;border-top:1px solid var(--border-2);margin:2em 0}

.md table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.9em}
.md th{background:var(--bg-2);padding:8px 12px;text-align:left;font-weight:600;color:var(--text-1);border:1px solid var(--border-2)}
.md td{padding:8px 12px;border:1px solid var(--border-1);color:var(--text-2)}
.md tr:hover td{background:var(--bg-2)}

.md img{max-width:100%;border-radius:var(--r-lg);margin:1em 0}

/* Linked notes */
.linked-section{margin-top:40px;padding-top:24px;border-top:1px solid var(--border-1)}

.linked-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4);margin-bottom:10px}

.linked-list{display:flex;flex-direction:column;gap:4px}

.linked-item{padding:8px 12px;background:var(--bg-2);border:1px solid var(--border-1);border-radius:var(--r-md);cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:8px}

.linked-item:hover{background:var(--bg-3);border-color:var(--border-2)}

.linked-item svg{width:13px;height:13px;stroke:var(--text-4);flex-shrink:0}

.linked-item-title{font-size:13px;color:var(--text-2);font-weight:450}

/* ── Command palette ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:1000;animation:fadeIn .12s}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.palette-box{width:90%;max-width:600px;background:var(--bg-2);border:1px solid var(--border-3);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);animation:slideUp .18s var(--ease);overflow:hidden}

@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.palette-input-row{padding:14px 16px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:10px}

.palette-input-row svg{width:16px;height:16px;stroke:var(--text-3);flex-shrink:0}

.palette-input{flex:1;background:transparent;border:none;color:var(--text-1);font-size:15px;font-family:var(--font);outline:none}

.palette-input::placeholder{color:var(--text-4)}

.palette-hint{font-size:11px;color:var(--text-4);flex-shrink:0}

.palette-filters{padding:8px 12px;border-bottom:1px solid var(--border-1);display:flex;gap:6px}

.filter-chip{padding:3px 10px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:20px;font-size:11px;color:var(--text-3);cursor:pointer;transition:all .1s;font-family:var(--font)}

.filter-chip:hover{border-color:var(--border-3);color:var(--text-1)}

.filter-chip.active{background:var(--accent-bg);border-color:var(--accent-bg2);color:var(--accent-3)}

.palette-results{max-height:380px;overflow-y:auto;padding:6px}

.palette-item{padding:10px 12px;border-radius:var(--r-md);cursor:pointer;display:flex;gap:10px;transition:background .1s;align-items:flex-start}

.palette-item:hover,.palette-item.sel{background:var(--bg-3)}

.palette-item-icon{width:28px;height:28px;background:var(--bg-4);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

.palette-item-icon svg{width:13px;height:13px;stroke:var(--text-3)}

.palette-item.sel .palette-item-icon{background:var(--accent-bg);border:1px solid var(--accent-bg2)}

.palette-item.sel .palette-item-icon svg{stroke:var(--accent-3)}

.palette-item-body{flex:1;min-width:0}

.palette-item-title{font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.palette-item-snippet{font-size:11.5px;color:var(--text-3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.palette-item-meta{display:flex;align-items:center;gap:6px;margin-top:4px}

.palette-score{height:3px;border-radius:2px;background:var(--accent);opacity:.6;min-width:4px;max-width:60px}

.palette-item-nb{font-size:10px;color:var(--text-4)}

.palette-empty{padding:32px;text-align:center;color:var(--text-4);font-size:13px}

.palette-footer{padding:10px 16px;border-top:1px solid var(--border-1);display:flex;gap:14px;font-size:11px;color:var(--text-4)}

.palette-footer kbd{font-family:var(--mono);padding:2px 5px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:3px;font-size:10px}

/* ── Editor modal ── */
.editor-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .12s}

.editor-box{width:92%;max-width:1100px;height:88vh;background:var(--bg-1);border:1px solid var(--border-3);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;animation:scaleIn .18s var(--ease-spring)}

@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.editor-header{padding:14px 18px;border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:10px;flex-shrink:0}

.editor-tabs{display:flex;gap:2px;background:var(--bg-2);border-radius:var(--r-sm);padding:3px}

.editor-tab{padding:5px 14px;background:transparent;border:none;border-radius:4px;color:var(--text-3);font-size:12px;font-weight:500;cursor:pointer;transition:all .1s;font-family:var(--font)}

.editor-tab:hover{color:var(--text-1)}

.editor-tab.active{background:var(--bg-4);color:var(--text-1)}

.editor-title-input{flex:1;background:transparent;border:none;color:var(--text-1);font-size:14px;font-weight:500;font-family:var(--font);outline:none;padding:0 8px}

.editor-title-input::placeholder{color:var(--text-4)}

.editor-save-btn{padding:6px 16px;background:var(--accent);border:none;border-radius:var(--r-sm);color:white;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .1s;display:flex;align-items:center;gap:6px}

.editor-save-btn:hover{background:var(--accent-2)}

.editor-save-btn svg{width:13px;height:13px;stroke:white}

.editor-close-btn{width:30px;height:30px;background:transparent;border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}

.editor-close-btn:hover{background:var(--bg-3);color:var(--text-1)}

.editor-close-btn svg{width:14px;height:14px;stroke:currentColor}

.editor-body{flex:1;display:grid;overflow:hidden}

.editor-body.split{grid-template-columns:1fr 1fr}

.editor-body.write{grid-template-columns:1fr}

.editor-body.preview{grid-template-columns:0 1fr}

.editor-pane-write{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border-1)}

.editor-textarea{flex:1;padding:28px 32px;background:transparent;border:none;color:var(--text-1);font-family:var(--mono);font-size:13.5px;line-height:1.7;resize:none;outline:none;tab-size:2}

.editor-textarea::placeholder{color:var(--text-4)}

.editor-pane-preview{overflow-y:auto;padding:28px 32px;background:var(--bg-0)}

.editor-footer{padding:12px 18px;border-top:1px solid var(--border-1);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}

.editor-field{display:flex;flex-direction:column;gap:5px;flex:1}

.editor-field label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4)}

.editor-field input{padding:7px 10px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-1);font-size:12.5px;font-family:var(--font);outline:none;transition:all .15s}

.editor-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.editor-field input::placeholder{color:var(--text-4)}

/* Tags autocomplete */
.tags-wrap{position:relative}

.tags-suggestions{position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:var(--bg-3);border:1px solid var(--border-3);border-radius:var(--r-md);box-shadow:var(--shadow-md);max-height:160px;overflow-y:auto;z-index:10}

.tag-suggestion{padding:7px 10px;font-size:12px;color:var(--text-2);cursor:pointer;transition:background .1s}

.tag-suggestion:hover,.tag-suggestion.sel{background:var(--bg-4);color:var(--text-1)}

/* ── Toast ── */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}

.toast{padding:10px 18px;background:var(--bg-4);border:1px solid var(--border-3);border-radius:var(--r-lg);color:var(--text-1);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .2s var(--ease);pointer-events:auto;white-space:nowrap}

.toast.success{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1);color:var(--green)}

.toast.error{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:var(--red)}

.toast.out{animation:toastOut .15s forwards}

@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-3)}

/* ── Sort dropdown ── */
.sort-dropdown{position:relative}

.sort-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg-3);border:1px solid var(--border-3);border-radius:var(--r-md);box-shadow:var(--shadow-md);min-width:140px;z-index:100;overflow:hidden}

.sort-option{padding:8px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:8px}

.sort-option:hover{background:var(--bg-4);color:var(--text-1)}

.sort-option.active{color:var(--accent-3)}

.sort-option svg{width:12px;height:12px;stroke:currentColor;opacity:.7}

/* ── Responsive ── */
@media(max-width:1200px){
  :root{--sidebar-w:180px}
}

@media(max-width:900px){
  .app{grid-template-columns:var(--list-w) 1fr}
  .sidebar{display:none}
}

@media(max-width:600px){
  .app{grid-template-columns:1fr}
  .list-panel{display:none}
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <svg viewBox="0 0 16 16"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm2 3v6m0-6h4m-4 3h3"/></svg>
      </div>
      <span class="brand">Nota</span>
      <button class="sidebar-new" onclick="startNew()" title="Nova nota (⌘N)">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
      </button>
    </div>

    <div class="sidebar-search">
      <div class="search-box" id="sidebar-search-box" onclick="focusSidebarSearch()">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="sidebar-search-input" placeholder="Buscar..." oninput="onSidebarSearch(this.value)" onfocus="document.getElementById('sidebar-search-box').classList.add('focused')" onblur="document.getElementById('sidebar-search-box').classList.remove('focused')">
        <span class="search-kbd">⌘K</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Início</div>
        <div class="nav-item active" id="nav-all" onclick="setFilter('all')">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
          <span class="nav-name">Todas as notas</span>
          <span class="nav-count" id="count-all">—</span>
        </div>
        <div class="nav-item" id="nav-recent" onclick="setFilter('recent')">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><polyline points="8,5 8,8 10,10"/></svg>
          <span class="nav-name">Recentes</span>
        </div>
      </div>
      <div class="nav-section" id="nav-notebooks"></div>
      <div class="nav-section" id="nav-categories"></div>
      <div class="nav-section" id="nav-tags"></div>
    </nav>
  </aside>

  <!-- List panel -->
  <section class="list-panel">
    <div class="list-header">
      <span class="list-title" id="list-title">Todas as notas</span>
      <span class="list-count" id="list-count"></span>
      <div class="sort-dropdown" id="sort-dropdown">
        <button class="sort-btn" onclick="toggleSortMenu()">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><line x1="2" y1="5" x2="14" y2="5"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="6" y1="11" x2="10" y2="11"/></svg>
          <span id="sort-label">Recente</span>
        </button>
        <div class="sort-menu hidden" id="sort-menu" style="display:none">
          <div class="sort-option active" onclick="setSort('recent')">
            <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><polyline points="8,5 8,8 10,10"/></svg>
            Mais recente
          </div>
          <div class="sort-option" onclick="setSort('accessed')">
            <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M8 2a6 6 0 100 12A6 6 0 008 2z"/><path d="M8 6v2l2 1"/></svg>
            Mais acessada
          </div>
          <div class="sort-option" onclick="setSort('alpha')">
            <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="10" y2="8"/><line x1="3" y1="12" x2="7" y2="12"/></svg>
            Alfabética
          </div>
        </div>
      </div>
    </div>
    <div class="list-body" id="list-body"></div>
  </section>

  <!-- Content panel -->
  <main class="content-panel" id="content-panel">
    <div class="content-empty">
      <svg viewBox="0 0 40 40" fill="none" stroke-width="1.2"><rect x="6" y="4" width="28" height="32" rx="3"/><line x1="12" y1="12" x2="28" y2="12"/><line x1="12" y1="18" x2="28" y2="18"/><line x1="12" y1="24" x2="22" y2="24"/></svg>
      <div class="content-empty-text">Selecione uma nota</div>
      <div class="content-empty-hint">ou pressione ⌘K para buscar</div>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let allNotes = [], currentNote = null, activeFilter = 'all', activeSort = 'recent';
let allTags = {}, editingId = null, sidebarSearchQ = '';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

marked.setOptions({ breaks: true, gfm: true });

// ── API ────────────────────────────────────────────────────────────────────
async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); }
  return r.json();
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const wrap = $('#toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, 2800);
}

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function relDate(iso) {
  if (!iso || iso.startsWith('0001')) return '';
  const d = new Date(iso), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min atrás`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
  if (diff < 86400*7) return `${Math.floor(diff/86400)}d atrás`;
  if (diff < 86400*30) return `${Math.floor(diff/86400/7)}sem atrás`;
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}

function wordCount(s) {
  return (s || '').trim().split(/\s+/).filter(Boolean).length;
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function stripMd(s) {
  return (s || '').replace(/^#+\s+/gm,'').replace(/\*\*?|__?|~~|`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim();
}

async function copyNoteId(id) {
  try {
    await navigator.clipboard.writeText(id);
    toast('ID copiado: ' + id, 'success');
  } catch {
    // Fallback para navegadores antigos
    const ta = document.createElement('textarea');
    ta.value = id;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('ID copiado', 'success');
  }
}

// ── Load & render ──────────────────────────────────────────────────────────
async function loadNotes() {
  showSkeletons();
  const p = new URLSearchParams();
  if (activeFilter.startsWith('tag:')) p.set('tags', activeFilter.slice(4));
  else if (activeFilter.startsWith('nb:')) p.set('notebook', activeFilter.slice(3));
  else if (activeFilter.startsWith('cat:')) p.set('category', activeFilter.slice(4));
  p.set('sort', activeSort);
  p.set('limit', '200');

  if (sidebarSearchQ) {
    // Use search endpoint for sidebar search
    p.set('q', sidebarSearchQ);
    try { allNotes = await api('/search?' + p); } catch { allNotes = []; }
  } else {
    try { allNotes = await api('/notes?' + p); } catch { allNotes = []; }
  }

  renderList();
}

async function loadSidebar() {
  try { allTags = await api('/tags'); } catch { allTags = {}; }

  const notebooks = {}, categories = {};
  // Use full list for sidebar counts (not filtered)
  try {
    const all = await api('/notes?limit=500');
    all.forEach(n => {
      if (n.notebook) notebooks[n.notebook] = (notebooks[n.notebook] || 0) + 1;
      if (n.category) categories[n.category] = (categories[n.category] || 0) + 1;
    });
    $('#count-all').textContent = all.length;
  } catch {}

  // Notebooks
  const nbEntries = Object.entries(notebooks).sort((a,b) => b[1]-a[1]);
  let nbHtml = nbEntries.length ? '<div class="nav-label">Cadernos</div>' : '';
  nbEntries.forEach(([name, count]) => {
    const active = activeFilter === 'nb:' + name ? 'active' : '';
    nbHtml += `<div class="nav-item ${active}" onclick="setFilter('nb:${esc(name)}')">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M3 2h8l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><polyline points="11,2 11,5 14,5"/></svg>
      <span class="nav-name">${esc(name)}</span>
      <span class="nav-count">${count}</span>
    </div>`;
  });
  $('#nav-notebooks').innerHTML = nbHtml;

  // Categories
  const catEntries = Object.entries(categories).sort((a,b) => b[1]-a[1]);
  let catHtml = catEntries.length ? '<div class="nav-label">Categorias</div>' : '';
  catEntries.forEach(([name, count]) => {
    const active = activeFilter === 'cat:' + name ? 'active' : '';
    catHtml += `<div class="nav-item ${active}" onclick="setFilter('cat:${esc(name)}')">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8"/><line x1="8" y1="11" x2="8.01" y2="11"/></svg>
      <span class="nav-name">${esc(name)}</span>
      <span class="nav-count">${count}</span>
    </div>`;
  });
  $('#nav-categories').innerHTML = catHtml;

  // Tags (top 15)
  const tagEntries = Object.entries(allTags).sort((a,b) => b[1]-a[1]).slice(0, 15);
  let tagHtml = tagEntries.length ? '<div class="nav-label">Tags</div>' : '';
  tagEntries.forEach(([name, count]) => {
    const active = activeFilter === 'tag:' + name ? 'active' : '';
    tagHtml += `<div class="nav-item ${active}" onclick="setFilter('tag:${esc(name)}')">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M9 2H3a1 1 0 00-1 1v6l6 6 6-6-5-7z"/><circle cx="5" cy="6" r="1" fill="currentColor" stroke="none"/></svg>
      <span class="nav-name">${esc(name)}</span>
      <span class="nav-count">${count}</span>
    </div>`;
  });
  $('#nav-tags').innerHTML = tagHtml;
}

function showSkeletons() {
  let html = '';
  for (let i = 0; i < 8; i++) {
    html += `<div class="skeleton-card">
      <div class="skeleton" style="height:13px;width:${60+Math.random()*30}%;margin-bottom:8px;border-radius:4px"></div>
      <div class="skeleton" style="height:11px;width:${40+Math.random()*40}%;margin-bottom:4px;border-radius:3px"></div>
      <div class="skeleton" style="height:11px;width:${20+Math.random()*30}%;border-radius:3px"></div>
    </div>`;
  }
  $('#list-body').innerHTML = html;
}

function renderList() {
  const body = $('#list-body');

  // Update active nav
  $$('.nav-item').forEach(el => el.classList.remove('active'));
  if (activeFilter === 'all') { const el = $('#nav-all'); if(el) el.classList.add('active'); }
  else if (activeFilter === 'recent') { const el = $('#nav-recent'); if(el) el.classList.add('active'); }

  // Title
  let title = 'Todas as notas';
  if (activeFilter === 'recent') title = 'Recentes';
  else if (activeFilter.startsWith('tag:')) title = activeFilter.slice(4);
  else if (activeFilter.startsWith('nb:')) title = activeFilter.slice(3);
  else if (activeFilter.startsWith('cat:')) title = activeFilter.slice(4);
  else if (sidebarSearchQ) title = `"${sidebarSearchQ}"`;

  $('#list-title').textContent = title;
  $('#list-count').textContent = allNotes.length ? `${allNotes.length}` : '';

  if (!allNotes.length) {
    body.innerHTML = `<div class="content-empty" style="padding:48px 0">
      <svg viewBox="0 0 40 40" fill="none" stroke-width="1.2" style="width:36px;height:36px;stroke:var(--text-4);opacity:.3"><rect x="6" y="4" width="28" height="32" rx="3"/><line x1="12" y1="12" x2="28" y2="12"/><line x1="12" y1="18" x2="28" y2="18"/><line x1="12" y1="24" x2="22" y2="24"/></svg>
      <div class="content-empty-text">Nenhuma nota</div>
    </div>`;
    return;
  }

  let html = '';
  allNotes.forEach(n => {
    const active = currentNote && currentNote.id === n.id ? 'active' : '';
    const preview = stripMd(n.snippet || n.preview || n.content || '');
    const tags = (n.tags || []).slice(0, 3).map(t => `<span class="pill">${esc(t)}</span>`).join('');
    const date = relDate(n.updated_at || n.created_at);
    const nb = n.notebook ? `<span class="note-card-nb">${esc(n.notebook)}</span>` : '';

    html += `<div class="note-card ${active}" onclick="openNote('${n.id}')">
      <div class="note-card-title">${esc(n.title)}</div>
      ${preview ? `<div class="note-card-preview">${esc(preview)}</div>` : ''}
      <div class="note-card-footer">
        <div class="note-card-tags">${tags}</div>
        ${nb}
        ${date ? `<span class="note-card-date">${date}</span>` : ''}
      </div>
    </div>`;
  });

  body.innerHTML = html;
}

// ── Open note ──────────────────────────────────────────────────────────────
async function openNote(id) {
  try {
    const note = await api('/notes/' + id);
    currentNote = note;
    renderList();
    renderContent();
  } catch(e) { toast(e.message, 'error'); }
}

function renderContent() {
  const panel = $('#content-panel');
  if (!currentNote) {
    panel.innerHTML = `<div class="content-empty">
      <svg viewBox="0 0 40 40" fill="none" stroke-width="1.2"><rect x="6" y="4" width="28" height="32" rx="3"/><line x1="12" y1="12" x2="28" y2="12"/><line x1="12" y1="18" x2="28" y2="18"/><line x1="12" y1="24" x2="22" y2="24"/></svg>
      <div class="content-empty-text">Selecione uma nota</div>
      <div class="content-empty-hint">ou pressione ⌘K para buscar</div>
    </div>`;
    return;
  }

  const n = currentNote;
  const date = relDate(n.updated_at || n.created_at);
  const words = wordCount(n.content);
  const tags = (n.tags || []).map(t =>
    `<span class="tag-pill" onclick="setFilter('tag:${esc(t)}')">${esc(t)}</span>`
  ).join('');

  // Breadcrumb
  let bc = '';
  if (n.notebook) bc += `<span>${esc(n.notebook)}</span>`;
  if (n.notebook && n.category) bc += `<span class="sep">›</span>`;
  if (n.category) bc += `<span class="bc-active">${esc(n.category)}</span>`;

  // Linked notes
  let linkedHtml = '';
  if (n.linked && n.linked.length) {
    const items = n.linked.map(l =>
      `<div class="linked-item" onclick="openNote('${l.id}')">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M10 6l-4 4m0-4l4 4"/><circle cx="5" cy="8" r="3"/><circle cx="11" cy="8" r="3"/></svg>
        <span class="linked-item-title">${esc(l.title)}</span>
      </div>`
    ).join('');
    linkedHtml = `<div class="linked-section">
      <div class="linked-label">Notas relacionadas</div>
      <div class="linked-list">${items}</div>
    </div>`;
  }

  panel.innerHTML = `
    <div class="content-header">
      <div class="breadcrumb">${bc || '<span style="opacity:.4">sem caderno</span>'}</div>
      <div class="content-actions">
        <button class="icon-btn" onclick="startEdit()" title="Editar (⌘E)">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3L11 2z"/></svg>
        </button>
        <button class="icon-btn danger" onclick="deleteNote('${n.id}')" title="Excluir">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><polyline points="3,4 13,4"/><path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M6 7v5m4-5v5"/><path d="M4 4l1 9a1 1 0 001 1h6a1 1 0 001-1l1-9"/></svg>
        </button>
      </div>
    </div>
    <div class="content-body">
      <div class="content-inner">
        <h1 class="content-title">${esc(n.title)}</h1>
        <div class="content-meta-row">
          ${date ? `<span class="content-meta-item"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="1"/><line x1="5" y1="1" x2="5" y2="5"/><line x1="11" y1="1" x2="11" y2="5"/><line x1="2" y1="7" x2="14" y2="7"/></svg>${date}</span>` : ''}
          <span class="content-meta-item"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h5"/></svg>${words} palavras</span>
          ${n.accessed ? `<span class="content-meta-item"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>${n.accessed}x</span>` : ''}
          <span class="content-meta-item content-meta-id" onclick="copyNoteId('${n.id}')" title="Clique para copiar o ID">
            <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="4" y="4" width="10" height="10" rx="1"/><path d="M12 4V3a1 1 0 00-1-1H3a1 1 0 00-1 1v7a1 1 0 001 1h1"/></svg>
            <span class="id-text">${n.id.slice(0,8)}</span>
          </span>
        </div>
        ${tags ? `<div class="content-tags-row">${tags}</div>` : '<div style="margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border-1)"></div>'}
        <div class="md">${marked.parse(n.content || '')}</div>
        ${linkedHtml}
      </div>
    </div>
  `;
}

// ── Filters & sort ─────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  currentNote = null;
  sidebarSearchQ = '';
  $('#sidebar-search-input').value = '';
  loadNotes();
  loadSidebar();
  renderContent();
}

const onSidebarSearch = debounce(q => {
  sidebarSearchQ = q.trim();
  if (sidebarSearchQ) activeFilter = 'search';
  else activeFilter = 'all';
  loadNotes();
}, 200);

function focusSidebarSearch() {
  $('#sidebar-search-input').focus();
}

let sortMenuOpen = false;
function toggleSortMenu() {
  sortMenuOpen = !sortMenuOpen;
  const m = $('#sort-menu');
  m.classList.toggle('hidden', !sortMenuOpen);
  m.style.display = sortMenuOpen ? 'block' : 'none';
}

function setSort(s) {
  activeSort = s;
  const labels = { recent: 'Recente', accessed: 'Acessadas', alpha: 'A-Z' };
  $('#sort-label').textContent = labels[s] || s;
  $('.sort-option').forEach(el => el.classList.remove('active'));
  $('.sort-option').forEach(el => { if (el.getAttribute('onclick') === `setSort('${s}')`) el.classList.add('active'); });
  closeSortMenu();
  loadNotes();
}

function closeSortMenu() {
  sortMenuOpen = false;
  const m = $('#sort-menu');
  if (m) { m.classList.add('hidden'); m.style.display = 'none'; }
}

document.addEventListener('click', e => {
  if (!sortMenuOpen) return;
  const dd = $('#sort-dropdown');
  if (dd && !dd.contains(e.target)) closeSortMenu();
}, true);

// ── Editor ─────────────────────────────────────────────────────────────────
function startNew() {
  editingId = null;
  openEditor('', [], '', '');
}

function startEdit() {
  if (!currentNote) return;
  editingId = currentNote.id;
  openEditor(currentNote.content || '', currentNote.tags || [], currentNote.notebook || '', currentNote.category || '');
}

function openEditor(content, tags, notebook, category) {
  if ($('.editor-overlay')) return;

  const tagsStr = (tags || []).join(', ');
  const overlay = document.createElement('div');
  overlay.className = 'editor-overlay';
  overlay.innerHTML = `
    <div class="editor-box">
      <div class="editor-header">
        <div class="editor-tabs">
          <button class="editor-tab active" onclick="setEditorTab('split',this)">Split</button>
          <button class="editor-tab" onclick="setEditorTab('write',this)">Escrever</button>
          <button class="editor-tab" onclick="setEditorTab('preview',this)">Preview</button>
        </div>
        <button class="editor-save-btn" onclick="saveEditor()">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M13 11v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h7l2 2v6z"/><rect x="5" y="9" width="6" height="4"/><rect x="5" y="3" width="4" height="3"/></svg>
          Salvar <span style="opacity:.6;font-size:11px">⌘S</span>
        </button>
        <button class="editor-close-btn" onclick="closeEditor()">
          <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
        </button>
      </div>
      <div class="editor-body split" id="editor-body">
        <div class="editor-pane-write">
          <textarea class="editor-textarea" id="editor-textarea" placeholder="# Título&#10;&#10;Escreva em markdown...">${esc(content)}</textarea>
        </div>
        <div class="editor-pane-preview" id="editor-preview">
          <div class="md">${marked.parse(content || '')}</div>
        </div>
      </div>
      <div class="editor-footer">
        <div class="editor-field tags-wrap">
          <label>Tags</label>
          <input id="editor-tags" placeholder="dev, api, docs..." value="${esc(tagsStr)}" oninput="onTagsInput(this)" onkeydown="onTagsKey(event)" autocomplete="off">
          <div class="tags-suggestions hidden" id="tags-suggestions"></div>
        </div>
        <div class="editor-field">
          <label>Caderno</label>
          <input id="editor-notebook" placeholder="pessoal" value="${esc(notebook)}">
        </div>
        <div class="editor-field">
          <label>Categoria</label>
          <input id="editor-category" placeholder="howto, rfc..." value="${esc(category)}">
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  setTimeout(() => $('#editor-textarea').focus(), 80);

  $('#editor-textarea').addEventListener('input', updateEditorPreview);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeEditor(); });
}

function closeEditor() {
  const el = $('.editor-overlay');
  if (el) el.remove();
}

function setEditorTab(tab, btn) {
  $('#editor-body').className = 'editor-body ' + tab;
  $$('.editor-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function updateEditorPreview() {
  const ta = $('#editor-textarea'), p = $('#editor-preview');
  if (ta && p) p.innerHTML = '<div class="md">' + marked.parse(ta.value || '') + '</div>';
}

// Tags autocomplete
let tagSuggIdx = -1;

function onTagsInput(input) {
  const val = input.value;
  const parts = val.split(',');
  const current = parts[parts.length - 1].trim().toLowerCase();
  const box = $('#tags-suggestions');

  if (!current || current.length < 1) { box.classList.add('hidden'); return; }

  const existing = parts.slice(0,-1).map(t => t.trim().toLowerCase());
  const matches = Object.keys(allTags)
    .filter(t => t.toLowerCase().includes(current) && !existing.includes(t.toLowerCase()))
    .slice(0, 8);

  if (!matches.length) { box.classList.add('hidden'); return; }

  tagSuggIdx = -1;
  box.innerHTML = matches.map((t,i) =>
    `<div class="tag-suggestion" onmousedown="selectTagSugg('${esc(t)}')" data-idx="${i}">${esc(t)}</div>`
  ).join('');
  box.classList.remove('hidden');
}

function onTagsKey(e) {
  const box = $('#tags-suggestions');
  if (box.classList.contains('hidden')) return;
  const items = box.querySelectorAll('.tag-suggestion');
  if (e.key === 'ArrowDown') { e.preventDefault(); tagSuggIdx = Math.min(tagSuggIdx+1, items.length-1); items.forEach((el,i) => el.classList.toggle('sel', i===tagSuggIdx)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); tagSuggIdx = Math.max(tagSuggIdx-1, 0); items.forEach((el,i) => el.classList.toggle('sel', i===tagSuggIdx)); }
  else if (e.key === 'Enter' || e.key === 'Tab') { if (tagSuggIdx >= 0) { e.preventDefault(); selectTagSugg(items[tagSuggIdx].textContent); } }
  else if (e.key === 'Escape') { box.classList.add('hidden'); }
}

function selectTagSugg(tag) {
  const input = $('#editor-tags');
  const parts = input.value.split(',');
  parts[parts.length - 1] = ' ' + tag;
  input.value = parts.join(',') + ', ';
  $('#tags-suggestions').classList.add('hidden');
  input.focus();
}

async function saveEditor() {
  const ta = $('#editor-textarea');
  if (!ta) return;
  const content = ta.value.trim();
  if (!content) { toast('Conteúdo vazio', 'error'); return; }

  const tags = ($('#editor-tags').value || '').split(',').map(t => t.trim()).filter(Boolean);
  const notebook = ($('#editor-notebook').value || '').trim();
  const category = ($('#editor-category').value || '').trim();

  try {
    if (editingId) {
      await api('/notes/' + editingId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content, tags, notebook, category }) });
      toast('Nota atualizada', 'success');
    } else {
      const r = await api('/notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content, tags, notebook, category }) });
      editingId = r.id;
      toast('Nota criada', 'success');
    }
    closeEditor();
    await loadNotes();
    await loadSidebar();
    if (editingId) openNote(editingId);
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteNote(id) {
  if (!confirm('Excluir esta nota?')) return;
  try {
    await api('/notes/' + id, { method:'DELETE' });
    toast('Nota excluída');
    currentNote = null;
    await loadNotes();
    await loadSidebar();
    renderContent();
  } catch(e) { toast(e.message, 'error'); }
}

// ── Command palette ────────────────────────────────────────────────────────
let paletteResults = [], paletteIdx = 0, paletteFilter = '';

function openPalette() {
  if ($('.overlay')) return;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="palette-box">
      <div class="palette-input-row">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input class="palette-input" id="palette-input" placeholder="Buscar notas... (tag: nb: cat:)" autofocus>
        <span class="palette-hint">ESC para fechar</span>
      </div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-footer">
        <span><kbd>↑↓</kbd> navegar</span>
        <span><kbd>↵</kbd> abrir</span>
        <span><kbd>⌘N</kbd> nova nota</span>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  setTimeout(() => $('#palette-input').focus(), 50);

  $('#palette-input').addEventListener('input', debounce(e => runPaletteSearch(e.target.value), 150));
  $('#palette-input').addEventListener('keydown', onPaletteKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePalette(); });

  runPaletteSearch('');
}

function closePalette() {
  const el = $('.overlay');
  if (el) el.remove();
}

async function runPaletteSearch(raw) {
  const q = raw.trim();
  paletteIdx = 0;

  try {
    if (!q) {
      paletteResults = allNotes.slice(0, 20);
    } else {
      const p = new URLSearchParams({ q, limit: '20' });
      paletteResults = await api('/search?' + p);
    }
  } catch { paletteResults = []; }

  renderPaletteResults();
}

function renderPaletteResults() {
  const container = $('#palette-results');
  if (!container) return;

  if (!paletteResults.length) {
    container.innerHTML = `<div class="palette-empty">Nenhum resultado — pressione ⌘N para criar</div>`;
    return;
  }

  container.innerHTML = paletteResults.map((n, i) => {
    const sel = i === paletteIdx ? 'sel' : '';
    const snippet = n.snippet || stripMd(n.preview || n.content || '');
    const scoreW = n.score ? Math.max(8, Math.round(n.score * 60)) : 0;
    const nb = n.notebook ? `<span class="palette-item-nb">${esc(n.notebook)}</span>` : '';
    const scoreBar = scoreW ? `<div class="palette-score" style="width:${scoreW}px"></div>` : '';

    return `<div class="palette-item ${sel}" onclick="selectPaletteItem(${i})">
      <div class="palette-item-icon">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1"/><line x1="5" y1="5" x2="11" y2="5"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="11" x2="8" y2="11"/></svg>
      </div>
      <div class="palette-item-body">
        <div class="palette-item-title">${esc(n.title)}</div>
        ${snippet ? `<div class="palette-item-snippet">${esc(snippet)}</div>` : ''}
        <div class="palette-item-meta">${scoreBar}${nb}</div>
      </div>
    </div>`;
  }).join('');
}

function onPaletteKey(e) {
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteIdx = Math.min(paletteIdx+1, paletteResults.length-1); renderPaletteResults(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIdx = Math.max(paletteIdx-1, 0); renderPaletteResults(); }
  else if (e.key === 'Enter') { e.preventDefault(); selectPaletteItem(paletteIdx); }
}

function selectPaletteItem(i) {
  const n = paletteResults[i];
  if (n) { closePalette(); openNote(n.id); }
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const inEditor = !!$('.editor-overlay');
  const inPalette = !!$('.overlay');

  if (e.key === 'Escape') {
    if (inPalette) closePalette();
    else if (inEditor) closeEditor();
    return;
  }

  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); if (!inEditor) openPalette(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); if (!inEditor && !inPalette) startNew(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'e') { e.preventDefault(); if (!inEditor && !inPalette && currentNote) startEdit(); }
  if (inEditor && (e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveEditor(); }
});

// ── Init ───────────────────────────────────────────────────────────────────
loadNotes();
loadSidebar();
</script>
</body>
</html>
